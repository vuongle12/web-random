<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển Từ Xa</title>
    <!-- Firebase SDK v10 (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
        }

        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 340px;
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 1.2rem;
            outline: none;
            text-align: center;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #27ae60;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-set {
            background-color: #27ae60;
        }

        .btn-set:hover {
            background-color: #219150;
        }

        .btn-clear {
            background-color: #e74c3c;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }

        .status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #555555;
            font-weight: 500;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Cài Đặt Kết Quả Từ Xa</h1>
        <input type="number" id="targetNumber" placeholder="Nhập số mong muốn">
        <button class="btn-set" onclick="setRiggedNumber()">Lưu Số Tiếp Theo</button>
        <button class="btn-clear" onclick="clearRiggedNumber()">Hủy Cài Đặt</button>
        <div class="status" id="status">Chưa có cài đặt nào.</div>
    </div>

    <script>
        // Dùng chung cấu hình Firebase với tệp index.html
        const firebaseConfig = {
            apiKey: "AIzaSyAWoeygIagK6p8r5jZFr9v0dqeJSyLipcs",
            authDomain: "random-app-851ea.firebaseapp.com",
            projectId: "random-app-851ea",
            storageBucket: "random-app-851ea.firebasestorage.app",
            messagingSenderId: "1068430464758",
            appId: "1:1068430464758:web:e5be452813f7206b513ed7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function setRiggedNumber() {
            const input = document.getElementById('targetNumber');
            const val = input.value;
            const status = document.getElementById('status');

            if (val === '') {
                status.textContent = 'Vui lòng nhập một số.';
                return;
            }

            // Đẩy giá trị lên cơ sở dữ liệu thời gian thực
            db.ref('rigged_number').set(val).then(() => {
                status.textContent = 'Đã lưu số ' + val + ' lên máy chủ.';
                input.value = '';
            }).catch((error) => {
                status.textContent = 'Lỗi kết nối cơ sở dữ liệu.';
            });
        }

        function clearRiggedNumber() {
            db.ref('rigged_number').remove().then(() => {
                document.getElementById('status').textContent = 'Đã hủy số cài đặt.';
            }).catch((error) => {
                document.getElementById('status').textContent = 'Lỗi kết nối cơ sở dữ liệu.';
            });
        }
    </script>

</body>
</html>
