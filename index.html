<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Thuật Anh - Việt</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-glow: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            top: 15%;
            left: 20%;
            background: rgba(59, 130, 246, 0.2);
        }
        body::after {
            bottom: 15%;
            right: 20%;
            background: rgba(6, 182, 212, 0.15);
        }

        .translator-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .lang-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 20px;
            margin-bottom: 20px;
        }

        .lang-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            width: 40%;
            text-align: center;
        }

        .swap-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .swap-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
            transform: rotate(180deg);
        }

        .translation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .translation-grid {
                grid-template-columns: 1fr;
            }
        }

        .text-area {
            width: 100%;
            height: 180px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .text-area:focus {
            border-color: var(--accent-glow);
        }

        .text-area[readonly] {
            background: rgba(0, 0, 0, 0.4);
            color: #cbd5e1;
        }

        .btn-translate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-translate:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.45);
        }

        .btn-translate:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="translator-card">
        <div class="header">
            <h1>Hệ Thống Dịch Thuật Anh - Việt</h1>
            <p>Công cụ chuyển đổi ngôn ngữ tối giản hai chiều</p>
        </div>

        <div class="lang-control">
            <span class="lang-label" id="sourceLangLabel">Tiếng Anh</span>
            <button class="swap-btn" onclick="switchLanguage()" title="Đảo chiều ngôn ngữ">&#8646;</button>
            <span class="lang-label" id="targetLangLabel">Tiếng Việt</span>
        </div>

        <div class="translation-grid">
            <textarea id="sourceText" class="text-area" placeholder="Nhập văn bản cần dịch..."></textarea>
            <textarea id="targetText" class="text-area" placeholder="Bản dịch sẽ hiển thị ở đây..." readonly></textarea>
        </div>

        <button class="btn-translate" onclick="executeTranslation()">Dịch Ngay</button>
    </div>

    <script>
        let sourceLang = 'en';
        let targetLang = 'vi';

        function switchLanguage() {
            if (sourceLang === 'en') {
                sourceLang = 'vi';
                targetLang = 'en';
                document.getElementById('sourceLangLabel').innerText = 'Tiếng Việt';
                document.getElementById('targetLangLabel').innerText = 'Tiếng Anh';
            } else {
                sourceLang = 'en';
                targetLang = 'vi';
                document.getElementById('sourceLangLabel').innerText = 'Tiếng Anh';
                document.getElementById('targetLangLabel').innerText = 'Tiếng Việt';
            }

            const sourceArea = document.getElementById('sourceText');
            const targetArea = document.getElementById('targetText');
            
            const temp = sourceArea.value;
            sourceArea.value = targetArea.value;
            targetArea.value = temp;
        }

        async function executeTranslation() {
            const text = document.getElementById('sourceText').value.trim();
            const output = document.getElementById('targetText');

            if (!text) {
                output.value = '';
                return;
            }

            output.value = 'Đang xử lý bản dịch...';

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();

                let result = '';
                if (data && data[0]) {
                    data[0].forEach(item => {
                        if (item[0]) result += item[0];
                    });
                }

                output.value = result || 'Không thể truy xuất bản dịch.';
            } catch (error) {
                output.value = 'Lỗi kết nối máy chủ dịch thuật.';
            }
        }
    </script>
</body>
</html>
