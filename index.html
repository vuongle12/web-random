<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Đơn Giản - Thuật Toán An Toàn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        .calculator {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 64px;
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: right;
            padding: 12px 16px;
            font-size: 2rem;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 16px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #f0f0f0;
            color: #333333;
            transition: background-color 0.15s ease, transform 0.05s ease;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active {
            transform: scale(0.98);
        }

        button.operator {
            background-color: #007aff;
            color: #ffffff;
        }

        button.operator:hover {
            background-color: #0062cc;
        }

        button.clear {
            background-color: #ff3b30;
            color: #ffffff;
        }

        button.clear:hover {
            background-color: #d70015;
        }

        button.equal {
            background-color: #34c759;
            color: #ffffff;
            grid-column: span 2;
        }

        button.equal:hover {
            background-color: #248a3d;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            <button onclick="appendValue('-')" class="operator">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>

            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            if (display.value === '0' || display.value.includes('Lỗi')) {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function deleteLast() {
            if (display.value.includes('Lỗi') || display.value.length === 1) {
                display.value = '0';
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        // Thuật toán tách token và tính toán tự viết bằng JavaScript (Không dùng eval)
        function parseAndEvaluate(expression) {
            let tokens = [];
            let i = 0;
            while (i < expression.length) {
                let char = expression[i];

                if (char === ' ') {
                    i++;
                    continue;
                }

                if ((char >= '0' && char <= '9') || char === '.') {
                    let numStr = '';
                    while (i < expression.length && ((expression[i] >= '0' && expression[i] <= '9') || expression[i] === '.')) {
                        numStr += expression[i];
                        i++;
                    }
                    if ((numStr.match(/\./g) || []).length > 1) {
                        throw new Error('Lỗi cú pháp');
                    }
                    tokens.push(parseFloat(numStr));
                } else if ('+-*/'.includes(char)) {
                    if (char === '-') {
                        let prev = tokens[tokens.length - 1];
                        if (tokens.length === 0 || (typeof prev === 'string' && '+-*/'.includes(prev))) {
                            i++;
                            let numStr = '-';
                            while (i < expression.length && ((expression[i] >= '0' && expression[i] <= '9') || expression[i] === '.')) {
                                numStr += expression[i];
                                i++;
                            }
                            if (numStr === '-' || (numStr.match(/\./g) || []).length > 1) {
                                throw new Error('Lỗi cú pháp');
                            }
                            tokens.push(parseFloat(numStr));
                            continue;
                        }
                    }
                    tokens.push(char);
                    i++;
                } else {
                    throw new Error('Ký tự không hợp lệ');
                }
            }

            if (tokens.length === 0) return 0;

            // Chuyển sang biểu thức Hậu vị (Shunting-Yard)
            let outputQueue = [];
            let operatorStack = [];
            const precedence = { '+': 1, '-': 1, '*': 2, '/': 2 };

            for (let token of tokens) {
                if (typeof token === 'number') {
                    outputQueue.push(token);
                } else if ('+-*/'.includes(token)) {
                    while (
                        operatorStack.length > 0 &&
                        precedence[operatorStack[operatorStack.length - 1]] >= precedence[token]
                    ) {
                        outputQueue.push(operatorStack.pop());
                    }
                    operatorStack.push(token);
                }
            }

            while (operatorStack.length > 0) {
                outputQueue.push(operatorStack.pop());
            }

            // Tính toán kết quả biểu thức Hậu vị (RPN)
            let stack = [];
            for (let token of outputQueue) {
                if (typeof token === 'number') {
                    stack.push(token);
                } else {
                    if (stack.length < 2) {
                        throw new Error('Lỗi cú pháp');
                    }
                    let b = stack.pop();
                    let a = stack.pop();
                    let result = 0;

                    if (token === '+') result = a + b;
                    else if (token === '-') result = a - b;
                    else if (token === '*') result = a * b;
                    else if (token === '/') {
                        if (b === 0) throw new Error('Lỗi chia 0');
                        result = a / b;
                    }
                    stack.push(result);
                }
            }

            if (stack.length !== 1) {
                throw new Error('Lỗi cú pháp');
            }

            let finalValue = stack[0];
            return Number.isInteger(finalValue) ? finalValue : parseFloat(finalValue.toFixed(8));
        }

        function calculate() {
            try {
                display.value = parseAndEvaluate(display.value);
            } catch (error) {
                display.value = error.message || 'Lỗi';
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if ((key >= '0' && key <= '9') || key === '.') {
                appendValue(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendValue(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape' || key.toLowerCase() === 'c') {
                clearDisplay();
            }
        });
    </script>

</body>
</html>
